# Triển khai thiết bị biên (Edge Device): 1 Thiết bị biên = 1 Camera Container
# Khởi chạy trên con biên:
#   docker compose up -d
# Chạy thử nghiệm video:
#   CAM_SOURCE="assets/speed1.mp4" docker compose up --build
# Xem log:
#   docker compose logs -f
# Dừng:
#   docker compose down

services:
  traffic-edge:
    image: traffic-edge:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: traffic-edge
    restart: always
    # network_mode host: giam toi da do tre RTSP va tranh packet loss tren Linux edge
    network_mode: host
    environment:
      - CONFIG_FILE=${CONFIG_FILE:-./configs/active.yaml}
      - CAM_SOURCE=${CAM_SOURCE:-}
      - IP_CAMERA=${IP_CAMERA:-}
      - TK_CAMERA=${TK_CAMERA:-}
      - PASSWORD_CAMERA=${PASSWORD_CAMERA:-}
      - EXTEND_RSTP_LINK=${EXTEND_RSTP_LINK:-}
      - IMGSZ=${IMGSZ:-}
      - DEBUG_RULES=${DEBUG_RULES:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - YOLO_CONFIG_DIR=/tmp
    volumes:
      # Mount file config rieng cua con bien nay (mac dinh configs/active.yaml,
      # ve bang draw tool roi pipeline doc tu day)
      - type: bind
        source: ${CONFIG_FILE:-./configs/active.yaml}
        target: /app/camera_config.yaml
        read_only: true
      - ./evidence:/app/evidence
      - ./data:/app/data
      - ./assets:/app/assets:ro
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
