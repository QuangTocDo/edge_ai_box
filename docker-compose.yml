# Hop dong dau vao: 1 SRC (video mp4 hay stream camera) + 1 CONFIG (loi da ve tu draw tool).
# Ve tren host (can GUI): python tools/draw_lines.py snap_cam01.jpg --config configs/cam_01.yaml
# Thu video: CAM_SOURCE=assets/video.mp4 docker compose up
# That RTSP (khuyen nghi secrets file thay vi env plain):
#   echo -n "rtsp://user:pass@ip/stream" > secrets/rtsp_cam01.txt
#   CAM_SOURCE_FILE=/run/secrets/rtsp_cam01 docker compose up -d
services:
  cam01:
    build: .
    image: traffic-edge
    container_name: traffic-cam01
    environment:
      # INPUT 1 - SRC: file mp4 (test) hoac stream (that). Chi nhan qua env/arg, khong nam trong config.
      # Neu dung secrets file, dat CAM_SOURCE_FILE thay vi CAM_SOURCE (uu tien file).
      - CAM_SOURCE=${CAM_SOURCE:-assets/video.mp4}
      - HEARTBEAT_FILE=/app/data/heartbeat
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      # INPUT 2 - CONFIG: file loi da ve (chi doc, mount ca thu muc de base.yaml ke thua duoc)
      - ./configs:/app/configs:ro
      # video test (chi doc; khi chay RTSP that khong can)
      - ./assets:/app/assets:ro
      # evidence + outbox + heartbeat giu lai tren host khi restart container
      - ./evidence:/app/evidence
      - ./data:/app/data
      # secrets (optional): - ./secrets/rtsp_cam01.txt:/run/secrets/rtsp_cam01:ro
    command: ["--config", "/app/configs/cam_01.yaml", "--no-show"]
    restart: unless-stopped
